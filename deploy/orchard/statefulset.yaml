# One Orchard controller. Its data is in /data. The loss of the data is recoverable: the workers
# register again, and the controller of this project removes the VMs of its jobs (target design,
# section 11), so there is no backup.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orchard
  labels:
    app.kubernetes.io/name: orchard
spec:
  replicas: 1
  serviceName: orchard
  selector:
    matchLabels:
      app.kubernetes.io/name: orchard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orchard
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orchard
          image: orchard
          # The certificate of the Secret orchard-tls, so that the clients trust an authority of
          # the operator and not a certificate that Orchard makes for itself. The certificate MUST
          # name the Service and the load balancer. ca.crt is the PEM that the controller of this
          # project takes in BK_AGENT_STACK_ORCHARD_ORCHARD_CA_CERT.
          args:
            - controller
            - run
            - --listen=:6120
            - --controller-cert=/etc/orchard/tls/tls.crt
            - --controller-key=/etc/orchard/tls/tls.key
          env:
            # The bootstrap admin exists only for the bootstrap Job, which creates the service
            # accounts of the controller and of the workers.
            - name: ORCHARD_BOOTSTRAP_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: orchard-bootstrap
                  key: bootstrap-admin-token
          envFrom:
            - configMapRef:
                name: orchard-telemetry
          ports:
            - name: api
              containerPort: 6120
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: api
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: api
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tls
              mountPath: /etc/orchard/tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: orchard-tls
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
