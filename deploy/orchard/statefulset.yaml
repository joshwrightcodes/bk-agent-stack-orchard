# One Orchard controller. Its data is in /data. The loss of the data is recoverable: the workers
# register again, and the controller of this project removes the VMs of its jobs (target design,
# section 11), so there is no backup.
#
# A StatefulSet, because Orchard keeps its state in an embedded database on /data and runs one
# scheduler, with no leader election: at most one pod may write to /data. A StatefulSet starts no
# replacement until the old pod is gone, also when a node fails. A Deployment could start a second
# pod while the first is Unknown, and only the attach lock of the volume would stand between two
# writers.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orchard
  labels:
    app.kubernetes.io/name: orchard
spec:
  replicas: 1
  serviceName: orchard-headless
  # A deletion or a scale-down of the StatefulSet leaves the data. The operator deletes the PVC.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: orchard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orchard
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orchard
          image: orchard
          # The certificate of the Secret orchard-tls, so that the clients trust an authority of
          # the operator and not a certificate that Orchard makes for itself. The certificate MUST
          # name the Service and the load balancer. ca.crt is the PEM that the controller of this
          # project takes in BK_AGENT_STACK_ORCHARD_ORCHARD_CA_CERT.
          args:
            - controller
            - run
            - --listen=:6120
            - --controller-cert=/etc/orchard/tls/tls.crt
            - --controller-key=/etc/orchard/tls/tls.key
          # The component deploy/orchard-overlays/first-start gives this container
          # ORCHARD_BOOTSTRAP_ADMIN_TOKEN for the first start only. The bootstrap Job needs the
          # bootstrap-admin account that the variable makes, and each start with the variable makes
          # the account again with all roles. With the component only in the first start, the pod
          # holds an admin token only until the first bootstrap (README, section "First start and
          # after the first bootstrap").
          envFrom:
            - configMapRef:
                name: orchard-telemetry
          ports:
            - name: api
              containerPort: 6120
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: api
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: api
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tls
              mountPath: /etc/orchard/tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: orchard-tls
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
