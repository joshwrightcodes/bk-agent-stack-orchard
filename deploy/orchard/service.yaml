# The controller of this project and the bootstrap Job reach Orchard on 6120 by the name of the
# Service, so the base keeps Orchard inside the cluster: the Service is a ClusterIP. The Mac hosts
# are outside the cluster, so an overlay adds an internal load balancer. The example is
# deploy/orchard-overlays/internal-lb. networkpolicy.yaml limits which pods and which addresses
# reach the port.
apiVersion: v1
kind: Service
metadata:
  name: orchard-headless
  labels:
    app.kubernetes.io/name: orchard
spec:
  # The governing Service of the StatefulSet, which gives the pod a stable name in DNS. The Service
  # below is how the controller of this project reaches Orchard.
  clusterIP: None
  selector:
    app.kubernetes.io/name: orchard
  ports:
    - name: api
      port: 6120
      targetPort: api
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: orchard
  labels:
    app.kubernetes.io/name: orchard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: orchard
  ports:
    - name: api
      port: 6120
      targetPort: api
      protocol: TCP
