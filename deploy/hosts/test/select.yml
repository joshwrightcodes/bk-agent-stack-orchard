# Checks the choice of the profiles of a host, with no host: a host pulls the image of each profile
# whose workerLabels its labels contain, and permits their softnetAllow, and no other.
- name: The images of the profiles
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: A general worker takes the general profiles and the profiles without labels
      ansible.builtin.include_role:
        name: orchard_worker
        tasks_from: select
      vars:
        orchard_worker_labels: {pool: general}
        orchard_worker_config_file: "{{ playbook_dir }}/testdata/values.yaml"

    - name: Check the general worker
      ansible.builtin.assert:
        that:
          - orchard_worker_images | unique == [general, anywhere]
          # The private addresses of its own profiles, once, and not those of the xcode profile.
          - orchard_worker_softnet_allow == ['10.20.30.40/32']
      vars:
        general: registry.test/general@sha256:1111111111111111111111111111111111111111111111111111111111111111
        anywhere: registry.test/anywhere@sha256:2222222222222222222222222222222222222222222222222222222222222222

    - name: A worker with more labels also takes the profile that needs them
      ansible.builtin.include_role:
        name: orchard_worker
        tasks_from: select
      vars:
        orchard_worker_labels: {pool: general, size: large}
        orchard_worker_config_file: "{{ playbook_dir }}/testdata/values.yaml"

    - name: Check the large worker
      ansible.builtin.assert:
        that: orchard_worker_images | unique | length == 3 and orchard_worker_images is search('registry.test/large')

    - name: A worker without labels takes only the profiles without labels
      ansible.builtin.include_role:
        name: orchard_worker
        tasks_from: select
      vars:
        orchard_worker_labels: {}
        orchard_worker_config_file: "{{ playbook_dir }}/testdata/values.yaml"

    - name: Check the worker without labels
      ansible.builtin.assert:
        that:
          - orchard_worker_images == ['registry.test/anywhere@sha256:2222222222222222222222222222222222222222222222222222222222222222']
          - orchard_worker_softnet_allow == []

    - name: The configuration file of the controller gives the profiles too
      ansible.builtin.include_role:
        name: orchard_worker
        tasks_from: select
      vars:
        orchard_worker_labels: {pool: xcode}
        orchard_worker_config_file: "{{ playbook_dir }}/testdata/config.yaml"

    - name: Check the xcode worker
      ansible.builtin.assert:
        that: orchard_worker_images == ['registry.test/xcode@sha256:3333333333333333333333333333333333333333333333333333333333333333']

    - name: A profile that permits more than the private ranges stops the host
      block:
        - name: Choose the profiles of a worker with the wide profile
          ansible.builtin.include_role:
            name: orchard_worker
            tasks_from: select
          vars:
            orchard_worker_labels: {pool: wide}
            orchard_worker_config_file: "{{ playbook_dir }}/testdata/wide.yaml"

        - name: The wide profile passed
          ansible.builtin.fail:
            msg: The role accepted the softnetAllow entry 0.0.0.0/0.
      rescue:
        - name: Check that only the wide entry failed
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Check the private addresses that the profiles permit'
              - ansible_failed_result.msg is search('also give 0.0.0.0/0[.]$')

    - name: A profile that permits a wide range inside the networks of the VMs stops the host
      block:
        - name: Choose the profiles of a worker with the profile of the pools
          ansible.builtin.include_role:
            name: orchard_worker
            tasks_from: select
          vars:
            orchard_worker_labels: {pool: pools}
            orchard_worker_config_file: "{{ playbook_dir }}/testdata/pools.yaml"

        - name: The profile of the pools passed
          ansible.builtin.fail:
            msg: The role accepted the softnetAllow entry 192.168.0.0/16.
      rescue:
        - name: Check that only the range wider than /29 failed
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Check that no permitted range holds the networks of the VMs'
              - ansible_failed_result.msg is search('also give 192.168.0.0/16[.]$')

# Checks the pf rules that the template gives for the profiles of a host: the guard holds the
# addresses inside softnetAllow that Softnet can give the host, before the pass of softnetAllow.
- name: The pf rules of a host
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Choose the profiles of a general worker
      ansible.builtin.include_role:
        name: orchard_worker
        tasks_from: select
        public: true
      vars:
        orchard_worker_labels: {pool: general}
        orchard_worker_config_file: "{{ playbook_dir }}/testdata/values.yaml"

    - name: Check the guard of the addresses that Softnet can give the host
      ansible.builtin.assert:
        that:
          # The first address of a /29 in the pools, alone or inside a narrow range, and every
          # address of a wide range. Not an address that is not the first of its /29, not an
          # address outside the pools, and not IPv6.
          - guard == ['10.0.0.0/8', '10.20.30.41/32', '172.16.5.1/32', '192.168.99.249/32']
          - wide == ['10.0.0.0/8']
      vars:
        allow: ['10.20.30.40/32', '10.20.30.41/32', '172.16.5.0/30', '192.168.99.249/32',
                '192.168.100.1/32', 'fd12:3456::/48', '10.0.0.0/8', '10.20.30.40/29']
        guard: "{{ allow | softnet_host_guard(orchard_worker_softnet_pools) }}"
        wide: "{{ allow | softnet_wide_overlaps(orchard_worker_softnet_pools) }}"

    - name: Make a file for the pf rules
      ansible.builtin.tempfile:
        suffix: .pf
      register: rules_file

    # select.yml sets the allow as a fact, which a variable of a task cannot replace.
    - name: Permit a gateway of Softnet
      ansible.builtin.set_fact:
        orchard_worker_softnet_allow: ['10.20.30.40/32', '10.20.30.41/32', '192.168.100.0/24']

    - name: Write the pf rules of a host with a gateway in softnetAllow
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/orchard_worker/templates/vm-isolation.pf.j2"
        dest: "{{ rules_file.path }}"
        mode: "0644"
      vars:
        orchard_worker_admin_interfaces: [en0, en1]

    - name: Read the pf rules
      ansible.builtin.set_fact:
        pf_rules: "{{ lookup('ansible.builtin.file', rules_file.path) }}"

    - name: Check the order of the pf rules
      ansible.builtin.assert:
        that:
          - pf_rules is search('table <bkaso_softnet_host_guard> persist [{] 10[.]20[.]30[.]41/32 [}]')
          - pf_rules is search('admin_addrs = "[{] [(]en0[)], [(]en1[)] [}]"')
          - positions == (positions | sort)
      vars:
        positions:
          - "{{ pf_rules.find('pass in quick on $admin_ifs all') }}"
          - "{{ pf_rules.find('port 53') }}"
          - "{{ pf_rules.find('block in quick from any to self') }}"
          - "{{ pf_rules.find('block in quick from any to $admin_addrs') }}"
          - "{{ pf_rules.find('to <bkaso_softnet_host_guard> user != unknown') }}"
          - "{{ pf_rules.find('pass in quick from any to <bkaso_softnet_allow>') }}"
          - "{{ pf_rules.find('block in quick from any to $private') }}"

    - name: Look for pfctl
      ansible.builtin.stat:
        path: /sbin/pfctl
      register: pfctl

    # pfctl -n parses the rules and loads nothing, so it needs no root. Only macOS has it.
    - name: Parse the pf rules with pfctl
      ansible.builtin.command: /sbin/pfctl -n -f {{ rules_file.path }}
      when: pfctl.stat.exists
      changed_when: false

    - name: Remove the pf rules of the test
      ansible.builtin.file:
        path: "{{ rules_file.path }}"
        state: absent

    # The launchd job and its script, which keep the rules in force on a host.
    - name: Make a directory for the launchd job
      ansible.builtin.tempfile:
        state: directory
      register: job_dir

    - name: Write the script and the launchd job of the pf rules
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/orchard_worker/templates/{{ item }}.j2"
        dest: "{{ job_dir.path }}/{{ item }}"
        mode: "0644"
      loop: [vm-isolation.sh, vm-isolation.plist]

    - name: Check the syntax of the script
      ansible.builtin.command: /bin/sh -n {{ job_dir.path }}/vm-isolation.sh
      changed_when: false

    - name: Look for plutil
      ansible.builtin.stat:
        path: /usr/bin/plutil
      register: plutil

    - name: Check the launchd job
      ansible.builtin.command: /usr/bin/plutil -lint {{ job_dir.path }}/vm-isolation.plist
      when: plutil.stat.exists
      changed_when: false

    - name: Read the launchd job
      ansible.builtin.set_fact:
        pf_job: "{{ lookup('ansible.builtin.file', job_dir.path + '/vm-isolation.plist') }}"

    - name: Check that launchd runs the script on a change of the network and every 30 seconds
      ansible.builtin.assert:
        that:
          - pf_job is search('<string>' + orchard_worker_pf_script + '</string>')
          - pf_job is search('<key>WatchPaths</key>\s*<array>\s*<string>/Library/Preferences/SystemConfiguration</string>')
          - pf_job is search('<key>StartInterval</key>\s*<integer>30</integer>')

    - name: Remove the launchd job of the test
      ansible.builtin.file:
        path: "{{ job_dir.path }}"
        state: absent

# Checks the filters of the drain and of the removal of cached images, with no host and no
# controller.
- name: The VMs that hold a drain, and the images that a host removes
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    no_vms: []
    vms:
      - {name: running, worker: mac-01, status: running, image: registry.test/a@sha256:1}
      - {name: pending, worker: mac-01, status: pending, image: registry.test/b@sha256:2}
      - {name: failed, worker: mac-01, status: failed, image: registry.test/c@sha256:3}
      - {name: elsewhere, worker: mac-02, status: running, image: registry.test/d@sha256:4}
      - {name: unplaced, status: pending, image: registry.test/e@sha256:5}
  tasks:
    - name: Check that a pending or running VM of the worker holds the drain, and a failed one does not
      ansible.builtin.assert:
        that:
          - vms | orchard_active_vms('mac-01') == ['pending', 'running']
          - vms | orchard_active_vms('mac-03') == []
          - no_vms | orchard_active_vms('mac-01') == []

    - name: Check that the play keeps the image of each VM of the worker, a failed one included
      ansible.builtin.assert:
        that: vms | orchard_vm_images('mac-01') == ['registry.test/a@sha256:1', 'registry.test/b@sha256:2', 'registry.test/c@sha256:3']

    - name: Check the cached images that a host removes
      ansible.builtin.assert:
        that: cached | tart_prunable(keep) == removed
      vars:
        keep:
          - registry.test/general@sha256:1111
          - registry.test/tagged:27
          - registry.test/plain
          - localhost:5000/ported:1
        cached:
          # Kept: a profile names it.
          - registry.test/general@sha256:1111
          # Removed: an old digest of a repository that a profile names by another digest.
          - registry.test/general@sha256:0000
          # Kept: a tag can link to the kept digest, and its removal would remove that digest.
          - registry.test/general:latest
          # Kept: a profile names the tag, and the digest can be its target.
          - registry.test/tagged:27
          - registry.test/tagged@sha256:cccc
          # Kept: a name with no tag or digest is the tag latest.
          - registry.test/plain:latest
          # Kept: the registry has a port, and the digest can be the target of the kept tag.
          - localhost:5000/ported:1
          - localhost:5000/ported@sha256:dddd
          # Removed: no profile names the repository.
          - registry.test/old@sha256:9999
          - registry.test/old:27
        removed:
          - registry.test/general@sha256:0000
          - registry.test/old:27
          - registry.test/old@sha256:9999
