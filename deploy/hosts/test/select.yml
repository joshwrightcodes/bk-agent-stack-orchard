# Checks the choice of the profiles of a host, with no host: a host pulls the image of each profile
# whose workerLabels its labels contain, and permits their softnetAllow, and no other.
- name: The images of the profiles
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: A general worker takes the general profiles and the profiles without labels
      ansible.builtin.include_role:
        name: orchard_worker
        tasks_from: select
      vars:
        orchard_worker_labels: {pool: general}
        orchard_worker_config_file: "{{ playbook_dir }}/testdata/values.yaml"

    - name: Check the general worker
      ansible.builtin.assert:
        that:
          - orchard_worker_images | unique == [general, anywhere]
          # The private addresses of its own profiles, once, and not those of the xcode profile.
          - orchard_worker_softnet_allow == ['10.20.30.40/32']
      vars:
        general: registry.test/general@sha256:1111111111111111111111111111111111111111111111111111111111111111
        anywhere: registry.test/anywhere@sha256:2222222222222222222222222222222222222222222222222222222222222222

    - name: A worker with more labels also takes the profile that needs them
      ansible.builtin.include_role:
        name: orchard_worker
        tasks_from: select
      vars:
        orchard_worker_labels: {pool: general, size: large}
        orchard_worker_config_file: "{{ playbook_dir }}/testdata/values.yaml"

    - name: Check the large worker
      ansible.builtin.assert:
        that: orchard_worker_images | unique | length == 3 and orchard_worker_images is search('registry.test/large')

    - name: A worker without labels takes only the profiles without labels
      ansible.builtin.include_role:
        name: orchard_worker
        tasks_from: select
      vars:
        orchard_worker_labels: {}
        orchard_worker_config_file: "{{ playbook_dir }}/testdata/values.yaml"

    - name: Check the worker without labels
      ansible.builtin.assert:
        that:
          - orchard_worker_images == ['registry.test/anywhere@sha256:2222222222222222222222222222222222222222222222222222222222222222']
          - orchard_worker_softnet_allow == []

    - name: The configuration file of the controller gives the profiles too
      ansible.builtin.include_role:
        name: orchard_worker
        tasks_from: select
      vars:
        orchard_worker_labels: {pool: xcode}
        orchard_worker_config_file: "{{ playbook_dir }}/testdata/config.yaml"

    - name: Check the xcode worker
      ansible.builtin.assert:
        that: orchard_worker_images == ['registry.test/xcode@sha256:3333333333333333333333333333333333333333333333333333333333333333']

    - name: A profile that permits more than the private ranges stops the host
      block:
        - name: Choose the profiles of a worker with the wide profile
          ansible.builtin.include_role:
            name: orchard_worker
            tasks_from: select
          vars:
            orchard_worker_labels: {pool: wide}
            orchard_worker_config_file: "{{ playbook_dir }}/testdata/wide.yaml"

        - name: The wide profile passed
          ansible.builtin.fail:
            msg: The role accepted the softnetAllow entry 0.0.0.0/0.
      rescue:
        - name: Check that only the wide entry failed
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Check the private addresses that the profiles permit'
              - ansible_failed_result.msg is search('also give 0.0.0.0/0[.]$')
