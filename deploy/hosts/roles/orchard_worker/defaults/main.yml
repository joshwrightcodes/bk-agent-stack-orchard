# The pinned versions. Orchard MUST be the version of mise.toml, which the tests run, and
# scripts/check-deps.py keeps the two in agreement.
orchard_worker_orchard_version: "0.58.0"
orchard_worker_orchard_sha256: "aa912db4d47d93413dabfd34c856c6ebb124e09d13fba70b5a62467276a1a71d"
orchard_worker_tart_version: "2.41.1"
orchard_worker_tart_sha256: "e680a734febccfce7d4e910c1f7f13fc3b00f19a181c945e2d746de3214c32c2"
orchard_worker_softnet_version: "0.24.1"
orchard_worker_softnet_sha256: "8ff8ff099c2b5ac1b1128e7999c4a730ac85f486c8a4cb0239eb98432859a0f7"

# The controller. The inventory MUST give the URL, the CA certificate (ca.crt of the orchard-tls
# Secret, as PEM), and the token of the account of this host (the key worker-<host> of the Secret
# orchard-worker-tokens, where <host> is orchard_worker_name).
orchard_worker_controller_url: ""
orchard_worker_ca_cert: ""
orchard_worker_account: "worker-{{ orchard_worker_name }}"
orchard_worker_token: ""

# The macOS user that runs Tart and owns the VMs. The worker starts as root and drops to this user,
# which is the workaround of Orchard for the Local Network permission. The user MUST log in
# automatically, because Tart and the registry credentials need its login keychain.
orchard_worker_user: "{{ ansible_user }}"
# The name of the worker, and the <host> of its account worker-<host>. The inventory MUST set it for
# each host, as a DNS label, and no two hosts may share it. It has no default, because a macOS host
# name can have upper case letters, and a name from the host name can differ from the key of the
# Secret orchard-worker-tokens.
# orchard_worker_name:
# The labels of the worker. A profile goes only to a worker whose labels contain its workerLabels.
orchard_worker_labels: {}

# Each Orchard process MUST have an explicit OTLP endpoint (target design, section 11).
orchard_worker_otlp_endpoint: ""

# The configuration file of the controller, or the values of its Helm chart, on the machine that
# runs Ansible. The host pulls the image of each profile that it can take, so that the images
# always agree with the profiles.
orchard_worker_config_file: ""
# The credentials of the registry for the pull, when it needs them.
orchard_worker_registry_username: ""
orchard_worker_registry_password: ""

# A change that restarts the worker (a new version of Orchard, Tart, or Softnet, a new token,
# labels, or controller URL) deletes every VM on the host, so the play drains the host first
# (tasks/drain.yml): it pauses the worker in Orchard, and waits until no VM of the worker is pending
# or running. A run that restarts nothing drains nothing. false changes the host without the API of
# Orchard: no drain, no wait for the worker to report, and no removal of cached images. A restart
# then deletes the VMs on the host, so use false only when the controller cannot answer.
orchard_worker_drain: true
# The drain time limit, in seconds. A VM placed just before the pause can take the boot and acquire
# timeouts of its profile (15 and 5 minutes by default), and its job then runs. The design expects
# the longest job to take 60 minutes, so 90 minutes covers such a job with 10 minutes to spare. When
# a VM still runs at the limit, the play resumes the worker, changes nothing that restarts it, and
# goes on with the next host. Raise the limit for longer jobs. The longest that a VM can live is
# maxVMLifetime (25 hours by default), which is too long to hold a play.
orchard_worker_drain_timeout: 5400
# How often the play counts the VMs of the worker during the drain, in seconds.
orchard_worker_drain_poll: 30
# true pauses the worker, waits until it runs no VM, and leaves it paused, with no change that
# restarts it. The next run without it makes the change and resumes the worker. Use it before the
# token of the host changes in Orchard, and before the removal of a host.
orchard_worker_drain_only: false
# How long the worker has to report to the controller after the play starts it, in seconds. The
# worker writes its record each 15 seconds.
orchard_worker_register_timeout: 300
# Remove each cached image that no profile of the host names and no VM of the worker uses
# (tasks/prune.yml).
orchard_worker_prune_images: true

# The job VMs run macOS 27.2, and a macOS guest needs a host of the same version or later
# (CO-07). The owner decided on 2026-11-01 that the hosts run macOS 27.2.
orchard_worker_macos_minimum: "27.2"
# A host MUST run VMs. Only a test on a VM, which cannot run a macOS VM, turns this check off.
orchard_worker_require_hypervisor: true

# The interfaces through which the operator reaches the host, for example with SSH. pf passes all of
# their traffic; from any other interface, a VM network included, the host is reachable only for
# DHCP and DNS.
orchard_worker_admin_interfaces:
  - "{{ ansible_facts['default_ipv4']['interface'] | default('en0') }}"

# The power settings of a host: no sleep of the system or the disks, and a start after a power
# failure and on a packet of the network.
orchard_worker_power_settings:
  sleep: 0
  disksleep: 0
  autorestart: 1
  womp: 1

orchard_worker_pf_label: io.github.joshwrightcodes.bkaso-vm-isolation
orchard_worker_pf_anchor: com.apple/400.bkaso-vm-isolation

orchard_worker_label_name: io.github.joshwrightcodes.orchard-worker
orchard_worker_prefix: /usr/local/opt/bkaso
orchard_worker_etc: /usr/local/etc/orchard-worker
