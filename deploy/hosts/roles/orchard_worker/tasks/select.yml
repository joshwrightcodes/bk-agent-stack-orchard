# The host serves each profile that it can take: a profile whose workerLabels the labels of the
# worker contain. It holds the image of each, and its pf rules let the VMs reach the private
# addresses that those profiles permit (softnetAllow). A 1 TB host holds only a few Xcode images
# (SC-09), so it pulls no other image. The profiles come from the configuration of the controller,
# so the host always agrees with them.
- name: Read the profiles of the controller
  ansible.builtin.set_fact:
    orchard_worker_profiles: "{{ (orchard_worker_config.config | default(orchard_worker_config)).profiles | default([], true) }}"
  vars:
    orchard_worker_config: "{{ lookup('ansible.builtin.file', orchard_worker_config_file) | from_yaml }}"

- name: Start with no profile
  ansible.builtin.set_fact:
    orchard_worker_images: []
    orchard_worker_softnet_allow: []

- name: Choose the profiles that the worker can run
  ansible.builtin.set_fact:
    orchard_worker_images: "{{ orchard_worker_images + [item.image] }}"
    orchard_worker_softnet_allow: "{{ (orchard_worker_softnet_allow + (item.softnetAllow | default([]))) | unique }}"
  loop: "{{ orchard_worker_profiles }}"
  loop_control:
    label: "{{ item.name }}"
  when: orchard_worker_labels | combine(item.workerLabels | default({})) == orchard_worker_labels
