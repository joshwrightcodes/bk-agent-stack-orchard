name: scorecard

# OpenSSF Scorecard checks the supply-chain practices of the repository: the branch rules, the
# pinned dependencies, the token permissions, the signed releases, and more. It publishes the
# result to scorecard.dev, where the badge of the README reads it, and it uploads the findings to
# code scanning.
#
# publish_results limits this workflow: no env or defaults at the top level or in the job, no run
# steps, only the actions below in the job, a hosted Ubuntu runner, and id-token: write only in
# this job. The default GITHUB_TOKEN reads the repository rules, so no other token is necessary.

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    # Monday, 05:30 UTC.
    - cron: "30 5 * * 1"

permissions: read-all

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The upload of the findings to code scanning.
      security-events: write
      # The OIDC token that publishes the result to scorecard.dev.
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
