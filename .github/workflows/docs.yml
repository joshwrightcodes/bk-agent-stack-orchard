name: documents

# The document set is accepted, so drift in it is a defect. These checks are the gate that keeps
# the set whole: the documents, the commit messages, and the C4 model. The title of a pull request
# has its own workflow, title.yml, so that a new title or description runs only that gate.
#
# Each mise-action step pins the same mise as release.yml (see ci.yml).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the run that it replaces. A run on main always finishes.
concurrency:
  group: documents-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every install that mise starts after the action, through mise x or mise run, also uses mise.lock,
# and fails on a tool or a checksum that the lock does not hold.
env:
  MISE_LOCKED: "1"

jobs:
  documents:
    name: document integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.24
      - run: mise run check-docs

  commits:
    name: commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The gate reads the history of the pull request. It pushes nothing.
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.24
      # The rules of the checker have tests of their own, with real messages, such as one from
      # Dependabot and one from Renovate.
      - run: mise run test-scripts
      # The checkout is the test merge of GitHub: its first parent is the base branch as it is
      # now, and its second parent is the pull request, so HEAD^1 leaves only the commits of the
      # pull request. The base SHA of the event can be older than the base branch, and then the
      # gate also checks commits that are already on the base branch.
      - env:
          # Event data never reaches the shell directly, even when it is a commit SHA.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3 ]; then
            base="$(git rev-parse HEAD^1)"
          else
            base="$BASE_SHA"
          fi
          # The Python of mise, not the one of the runner, so that CI and a developer run the
          # same interpreter.
          mise x -- python3 scripts/check-commits.py "$base"

  c4:
    name: c4 model
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.24
      - run: mise run check-c4
