name: documents

# The document set is accepted, so drift in it is a defect. These checks are the gate that keeps
# the set whole: the documents, the commit messages, and the C4 model.

on:
  pull_request:
    # A new title runs the title gate again. The first three are the defaults.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: documents-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documents:
    name: document integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - run: mise run check-docs

  commits:
    name: commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      # The rules of the checker have tests of their own, with real messages, such as one from
      # Dependabot and one from Renovate.
      - run: mise run test-scripts
      # The checkout is the test merge of GitHub: its first parent is the base branch as it is
      # now, and its second parent is the pull request, so HEAD^1 leaves only the commits of the
      # pull request. The base SHA of the event can be older than the base branch, and then the
      # gate also checks commits that are already on the base branch.
      - env:
          # Event data never reaches the shell directly, even when it is a commit SHA.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3 ]; then
            base="$(git rev-parse HEAD^1)"
          else
            base="$BASE_SHA"
          fi
          python3 scripts/check-commits.py "$base"

  title:
    name: pull request title
    runs-on: ubuntu-latest
    # A bot writes its own titles, and a module path can pass 65 characters. A skipped job
    # reports success, so this job can still be a required check.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The squash commit takes the title, and GitHub adds " (#NNN)", so the limit is 65.
      - env:
          # The title is free text from the author, so it reaches the shell only as a variable.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/check-commits.py --title "$PR_TITLE"

  c4:
    name: c4 model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - run: mise run check-c4
