name: generate

# The Orchard wire types are generated from a pinned commit of Orchard. This job writes them
# again and fails when the result is different from the tree, which is how a contract that moved
# reaches a person.
#
# It runs only for a change that can move the generated file, because it reads Orchard over the
# network and a pull request that touches neither the client nor the generator should not wait
# for it. The weekly upstream job runs the same check without a change, which catches a tag that
# moved.

on:
  pull_request:
    paths:
      - internal/orchard/**
      - tools/orchardgen/**
      - docs/architecture/target-design.md
      - .github/workflows/generate.yml
  push:
    branches: [main]
    paths:
      - internal/orchard/**
      - tools/orchardgen/**
      - docs/architecture/target-design.md
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run that it replaces. A run on main always finishes.
concurrency:
  group: generate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every install that mise starts after the action, through mise x or mise run, also uses mise.lock,
# and fails on a tool or a checksum that the lock does not hold.
env:
  MISE_LOCKED: "1"

jobs:
  generated-files:
    name: generated files are current
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The same mise as release.yml (see ci.yml).
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.24
      - run: mise run check-generate
