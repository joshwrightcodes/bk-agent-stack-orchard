name: ci

# The Go gates: the dependency rules, the linters, the tests, and the release artifacts, and the
# linters of the scripts and the workflows. The document gates live in docs.yml, and the title
# gate in title.yml.
#
# Each mise-action step pins the same mise as release.yml. The action checks the binary against
# the signed checksums of the mise release, and Renovate moves every pin together.
#
# On a pull request, a job runs only when the pull request changes one of its inputs (the changes
# job). Lint and test always runs, because its tests also read documents and scripts. Known
# vulnerabilities always runs too: the code scanning rule of main needs a result from govulncheck,
# as from golangci-lint, on each pull request, and a vulnerability that was published after the
# last run applies to code that the pull request did not change. A push to main runs every job, so that main keeps a full result, the caches, and the code-scanning
# baseline. The ci result job is the one required check of this workflow: it fails when a job
# failed or was cancelled, and passes when each job passed or had no input to check.

on:
  pull_request:
  push:
    branches: [main]

# Each job reads the repository only. The jobs that upload findings to code scanning get more,
# below.
permissions:
  contents: read

# A new push to a pull request cancels the run that it replaces. A run on main always finishes,
# so that each commit of main keeps its result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every install that mise starts after the action, through mise x or mise run, also uses mise.lock,
# and fails on a tool or a checksum that the lock does not hold.
env:
  MISE_LOCKED: "1"
  # The linters upload their findings to code scanning, one category for each tool, on a push to
  # main and on a pull request from a branch of this repository. The token of a pull request from
  # a fork cannot write security events, so that run skips the uploads. The upload steps use this
  # value.
  SARIF_UPLOAD: >-
    ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main')
    || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  changes:
    name: changed inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # On a pull request, the filter reads the changed files from the API, without a checkout.
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      scripts: ${{ steps.filter.outputs.scripts }}
      deploy: ${{ steps.filter.outputs.deploy }}
      smoke: ${{ steps.filter.outputs.smoke }}
      release: ${{ steps.filter.outputs.release }}
    steps:
      # A push to main skips the filter, and each job then runs.
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Each filter holds the inputs of its job. A change to the toolchain or to this workflow
          # runs every job.
          filters: |
            toolchain: &toolchain
              - .github/workflows/ci.yml
              - mise.toml
              - mise.lock
              - .mise/**
            go: &go
              - *toolchain
              - "**/*.go"
              - "**/testdata/**"
              - go.mod
              - go.sum
            scripts:
              - *toolchain
              - "**/*.sh"
              - "**/*.py"
              - images/files/environment
              - .github/**
              - ruff.toml
            deploy:
              - *toolchain
              - deploy/**
              - images/**
              - test/smoke/**
              - scripts/check-hook.sh
            smoke:
              - *go
              - deploy/helm/**
              - deploy/orchard/**
              - test/smoke/**
              - scripts/smoke.sh
              - .ko.yaml
            release:
              - *go
              - .goreleaser.yaml
              - .ko.yaml
              - scripts/licenses.sh
              - scripts/check-image.sh
              - LICENSE*
              - LICENSES/**
              - NOTICE
              - README*

  go:
    name: lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # only-new-issues reads the diff of the pull request.
      pull-requests: read
      # The upload of the golangci-lint findings to code scanning.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.24
      # The modules and the build cache of Go, from the last run of this job on main. A pull request
      # only reads them, so its code cannot change what main builds with.
      - name: find the go caches
        id: go-cache
        run: |
          echo "modules=$(mise x -- go env GOMODCACHE)" >>"$GITHUB_OUTPUT"
          echo "build=$(mise x -- go env GOCACHE)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.build }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: mise run check-deps
      - run: mise run check-tidy

      # The analysis runs through the action, which turns each finding into an annotation on the
      # changed line. install-mode "none" uses the golangci-lint that mise installed, so
      # mise.toml stays the one place that pins the version. The annotations come from the
      # problem matchers of the action, which the runner applies to the output.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          install-mode: none
          problem-matchers: true
          # A pull request reports only its new findings. A push to main reports all of them, so
          # a finding that a pull request did not touch still fails main.
          only-new-issues: ${{ github.event_name == 'pull_request' }}
          # The text output feeds the problem matchers, and the SARIF output feeds code scanning.
          # golangci-lint prints no text output when only a SARIF path is given.
          args: --output.text.path=stdout --output.sarif.path=build/sarif/golangci-lint.sarif

      - run: mise run lint-format
      - run: mise run lint-config
      # coverage runs the tests of mise run test, with the race detector and a coverage profile,
      # and fails when the total is below the threshold in scripts/coverage.sh.
      - run: mise run coverage
      - name: write the coverage summary
        if: always() && hashFiles('build/coverage.md') != ''
        run: cat build/coverage.md >>"$GITHUB_STEP_SUMMARY"
      - name: upload the coverage report
        if: always() && hashFiles('build/coverage.out') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            build/coverage.out
            build/coverage.html
          retention-days: 30

      # A failed lint step still uploads its findings. The upload runs last, so that a failed
      # upload does not stop the gates above.
      - name: upload the golangci-lint findings
        if: always() && env.SARIF_UPLOAD == 'true' && hashFiles('build/sarif/golangci-lint.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: build/sarif/golangci-lint.sarif
          category: golangci-lint
      - name: save the go caches
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.build }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  scripts:
    name: lint scripts
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.scripts == 'true'
    # shellcheck and shfmt for the shell scripts, ruff for the Python scripts, and actionlint and
    # zizmor for the workflows (mise run lint-scripts).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # The upload of the ruff, actionlint, and zizmor findings to code scanning.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.24
      # When the run can upload, ruff, actionlint, and zizmor write their SARIF output to
      # build/sarif in the same run, for the uploads below. The gate still fails on a finding.
      - env:
          SARIF_DIR: ${{ env.SARIF_UPLOAD == 'true' && 'build/sarif' || '' }}
        run: mise run lint-scripts
      # mise lock reads the release of each tool from GitHub, which limits an anonymous caller.
      - name: check the lock
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run check-lock

      - name: upload the ruff findings
        if: always() && env.SARIF_UPLOAD == 'true' && hashFiles('build/sarif/ruff.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: build/sarif/ruff.sarif
          category: ruff
      - name: upload the actionlint findings
        if: always() && env.SARIF_UPLOAD == 'true' && hashFiles('build/sarif/actionlint.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: build/sarif/actionlint.sarif
          category: actionlint
      - name: upload the zizmor findings
        if: always() && env.SARIF_UPLOAD == 'true' && hashFiles('build/sarif/zizmor.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: build/sarif/zizmor.sarif
          category: zizmor

  vulnerabilities:
    name: known vulnerabilities
    # govulncheck fails only on a vulnerability that the code can call. A vulnerable module that
    # the code does not reach is a report, not a failure.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # The upload of the govulncheck findings to code scanning.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.24
      # The modules and the build cache of Go, from the last run of this job on main. A pull request
      # only reads them, so its code cannot change what main builds with.
      - name: find the go caches
        id: go-cache
        run: |
          echo "modules=$(mise x -- go env GOMODCACHE)" >>"$GITHUB_OUTPUT"
          echo "build=$(mise x -- go env GOCACHE)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.build }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      # When the run can upload, govulncheck writes its SARIF output to build/sarif in the same run,
      # and the task fails on a vulnerability that the code calls, as the text output does.
      - env:
          SARIF_DIR: ${{ env.SARIF_UPLOAD == 'true' && 'build/sarif' || '' }}
        run: mise run vuln
      - name: upload the govulncheck findings
        if: always() && env.SARIF_UPLOAD == 'true' && hashFiles('build/sarif/govulncheck.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: build/sarif/govulncheck.sarif
          category: govulncheck
      - name: save the go caches
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.build }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  deploy:
    name: deploy manifests
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.24
      - run: mise run check-deploy
      - run: mise run check-hook
      - run: mise run check-hosts
      # The image of the Orchard controller builds, and its archive matches the SHA-256 of
      # mise.toml. It is not published: the operator builds it for the registry of the fleet.
      - run: mise run orchard-image

  smoke:
    name: smoke deployment
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.smoke == 'true'
    # The chart and the Orchard base on kind: the controller becomes ready through its gRPC
    # readiness probe, and the collector receives its metrics and spans (W-21).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.24
      # The modules and the build cache of Go, from the last run of this job on main. A pull request
      # only reads them, so its code cannot change what main builds with.
      - name: find the go caches
        id: go-cache
        run: |
          echo "modules=$(mise x -- go env GOMODCACHE)" >>"$GITHUB_OUTPUT"
          echo "build=$(mise x -- go env GOCACHE)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.build }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: mise run smoke
      - name: save the go caches
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.build }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  integration:
    name: integration tests
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.go == 'true'
    # macOS on arm64, and nothing else. Orchard places a machine only on a worker of the same
    # architecture and runtime. The machine of each test is arm64 and runs on Tart, which is
    # right for a fleet of Apple silicon. A synthetic worker takes its architecture from the host
    # and its runtime from the host OS: Tart on macOS, and Vetu on Linux. On any Linux runner,
    # arm64 included, Orchard never places the machine.
    #
    # The runner is fixed. A self-hosted runner MUST NOT serve a public repository, because a pull
    # request from a fork could run code on it. A hosted runner is a new VM for each job, so no
    # run leaves a process for the next.
    runs-on: macos-latest
    # A hung orchard dev holds a macOS runner, which costs more than a Linux one.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # mise installs the Orchard that mise.toml pins, and checks it against the SHA-256 there.
      # The tests run `orchard dev --synthetic`, so they need no Tart and no virtual machine. CI
      # sets CI=true, and a test then fails instead of skipping when the binary is missing.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.24
      # The modules and the build cache of Go, from the last run of this job on main. A pull request
      # only reads them, so its code cannot change what main builds with.
      - name: find the go caches
        id: go-cache
        run: |
          echo "modules=$(mise x -- go env GOMODCACHE)" >>"$GITHUB_OUTPUT"
          echo "build=$(mise x -- go env GOCACHE)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.build }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: mise run integration
      # The VM startup script runs in a macOS guest, so its tests run here, under the sh and zsh
      # of macOS. CI=true makes a missing shell fail the test.
      - run: mise run test-startup-script
      - name: save the go caches
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.build }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  release:
    name: snapshot release
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # GoReleaser reads the tags to name a snapshot.
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.24
      # The modules and the build cache of Go, from the last run of this job on main. A pull request
      # only reads them, so its code cannot change what main builds with.
      - name: find the go caches
        id: go-cache
        run: |
          echo "modules=$(mise x -- go env GOMODCACHE)" >>"$GITHUB_OUTPUT"
          echo "build=$(mise x -- go env GOCACHE)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.build }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: mise run snapshot
      - name: save the go caches
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.build }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  result:
    name: ci result
    # The one required check of this workflow. A job that the filter skipped passes, and so does a
    # job that a failed job before it skipped, so the check reads the result of each job instead.
    if: always()
    needs: [changes, go, scripts, vulnerabilities, deploy, smoke, integration, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null
