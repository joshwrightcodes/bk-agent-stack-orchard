name: ci

# The Go gates: the dependency rules, the linters, the tests, and the release artifacts. The
# document gates live in documents.yml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # The lint action writes its findings as annotations on the pull request.
  checks: write
  # only-new-issues reads the diff of the pull request.
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - run: mise run check-deps

      # The analysis runs through the action, which turns each finding into an annotation on the
      # changed line. install-mode "none" uses the golangci-lint that mise installed, so
      # mise.toml stays the one place that pins the version.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          install-mode: none
          only-new-issues: true

      - run: mise run lint-format
      - run: mise run lint-config
      - run: mise run test

  integration:
    name: skeleton journey
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # mise installs the Orchard that mise.toml pins, and checks it against the SHA-256 there.
      # The test runs `orchard dev --synthetic`, so it needs no Mac and no Tart. CI sets CI=true,
      # and the test then fails instead of skipping when the binary is missing.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - run: mise run integration

  release:
    name: snapshot release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # GoReleaser reads the tags to name a snapshot.
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - run: mise run snapshot
