name: title

# The title and description gate of a pull request. It has a workflow of its own because it alone
# reads them: a new title or description (the edited event) runs this gate again, and not the other
# gates. The job keeps its name, because the ruleset of main requires the check by that name.

on:
  pull_request:
    # The first three are the defaults.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# A new title or push cancels the check of the old one.
concurrency:
  group: title-${{ github.ref }}
  cancel-in-progress: true

# Every install that mise starts after the action, through mise x or mise run, also uses mise.lock,
# and fails on a tool or a checksum that the lock does not hold.
env:
  MISE_LOCKED: "1"

jobs:
  title:
    name: pull request title
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A bot writes its own titles, and a module path can pass 65 characters. A skipped job
    # reports success, so this job can still be a required check.
    if: github.event.pull_request.user.type != 'Bot'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The disclosure gate reads the commits of the pull request. It pushes nothing.
          fetch-depth: 0
          persist-credentials: false
      # The same mise as release.yml (see ci.yml). The gate needs only Python.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.24
          install_args: python
      # The squash commit takes the title, and GitHub adds " (#NNN)", so the limit is 65.
      - env:
          # The title is free text from the author, so it reaches the shell only as a variable.
          PR_TITLE: ${{ github.event.pull_request.title }}
        # The Python of mise, not the one of the runner. Only Python is installed, so mise x
        # names it, and does not install the other tools of mise.toml.
        run: mise x python -- python3 scripts/check-commits.py --title "$PR_TITLE"
      # AI_POLICY.md requires a disclosure. The description is free text from the author, so it
      # reaches only the environment of the script, and never the shell. docs.yml explains how
      # the checkout gives the commits of the pull request.
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3 ]; then
            base="$(git rev-parse HEAD^1)"
          else
            base="$BASE_SHA"
          fi
          mise x python -- python3 scripts/check-commits.py --disclosure "$base"
