name: release

# A release tag publishes the archives, the image, and the chart, each signed with a keyless cosign
# signature, with an SBOM for each archive and each platform image (ADR-0013). CONTRIBUTING.md
# gives the version rules, and only the maintainer creates a release tag. The certificate of each
# signature names this file and the tag, which is what scripts/verify-release.sh checks.

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      # The GitHub release and its assets.
      contents: write
      # The image and the chart in ghcr.io.
      packages: write
      # The OIDC token that Sigstore exchanges for a signing certificate.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # GoReleaser reads the tags for the release notes, and the check below reads main.
          fetch-depth: 0
          persist-credentials: false

      - id: tag
        name: check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(python3 scripts/check-release-tag.py "$TAG")"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "release: $TAG is not on main" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # A cache that another run wrote must not reach the tools that sign a release.
          cache: false

      - name: log in to ghcr.io
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          printf '%s' "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin

      - name: package the chart
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: ./scripts/release-chart.sh "$VERSION"

      - name: build, sign, and upload to a draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: goreleaser release --clean

      - name: sign the image and the chart
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/release-publish.sh "$TAG"

      - name: verify the signatures
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/verify-release.sh "$TAG" dist

      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
