name: fuzz

# Each pull request runs the seed inputs of the fuzz tests through go test. This workflow fuzzes
# each target for longer, each night and on demand. When a target fails, go writes the input to
# testdata/fuzz in its package, and the run keeps those files as an artifact. docs/development.md
# says what to do with one.

on:
  schedule:
    # Each night, 02:50 UTC.
    - cron: "50 2 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "The time for each fuzz target, as go test -fuzztime takes it"
        default: "2m"

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - env:
          # Event data reaches the shell through the environment, never by interpolation.
          FUZZTIME: ${{ inputs.fuzztime || '2m' }}
        run: mise run fuzz
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures
          path: internal/**/testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 30
