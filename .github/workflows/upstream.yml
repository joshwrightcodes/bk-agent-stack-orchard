name: upstream

# Several accepted facts carry a version and a date: the minimum Orchard version, the Tart
# version, the Buildkite agent line, the Stacks API client, and the published macOS images. This
# job reports when one of them moves, so that a document answers the change instead of a
# production job finding it.

on:
  schedule:
    # Monday, 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream
  cancel-in-progress: false

# Every install that mise starts after the action, through mise x or mise run, also uses mise.lock,
# and fails on a tool or a checksum that the lock does not hold.
env:
  MISE_LOCKED: "1"

jobs:
  watch:
    name: upstream releases
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # The report opens or comments on the upstream issue.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The same mise as release.yml (see ci.yml). It installs the Python that runs the check, and
      # the Go that runs the generator.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.24

      - id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise x -- python3 scripts/check-upstream.py --output upstream-table.md

      # The client of this project is not generated, so this reports when a field that it uses
      # moves in the version that the documents pin.
      - name: orchard contract
        run: mise run check-generate

      # The version report runs even when the contract check fails, so that a week with both
      # changes reports both.
      - name: report
        if: always() && steps.check.outputs.moved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Context values reach the shell through the environment, never by interpolation.
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          {
            echo "An upstream dependency moved past the version that the documents state."
            echo
            cat upstream-table.md
            echo
            echo "What to do with this:"
            echo
            echo "* A new Orchard release can change the minimum version in the target design."
            echo "  Read its notes before the version moves."
            echo "* A new Buildkite agent line changes the baseline and the pilot image."
            echo "* A published macOS image with Xcode 27 can remove the image build from the"
            echo "  pilot, which makes that work smaller."
            echo "* A version change needs a document change, and sometimes a decision record."
            echo "  This issue is the trigger, not the decision."
          } > upstream-issue.md

          # The script finds the open issue with this exact title, and adds the link to the run.
          ./scripts/report-failure.sh --label upstream "Upstream releases moved" "$(cat upstream-issue.md)"

  # A failed run opens an issue, or comments on the one that is open: the check could not read an
  # upstream release, or the Orchard contract moved.
  report:
    name: report failure
    needs: watch
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The report opens or comments on the issue.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          # Context values reach the shell through the environment, never by interpolation.
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          ./scripts/report-failure.sh "Weekly upstream check failed"
          "The upstream check failed: an upstream release could not be read, or the Orchard
          contract moved."
