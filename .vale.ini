# Vale checks the language rules of docs/writing-guide.md that a tool can check. mise run check-docs
# runs it. The rules are in .vale/styles/Project, and need no download.
StylesPath = .vale/styles
MinAlertLevel = suggestion

# Every Markdown file: the maintainers are named in MAINTAINERS.md only.
[*.md]
BasedOnStyles = Project
Project.Keywords = NO
Project.DesignIDs = NO
Project.Avoid = NO
Project.SentenceLength = NO

[MAINTAINERS.md]
Project.Names = NO

# The accepted ADRs keep their decision-makers in their front matter, as a record.
[docs/adrs/*.md]
Project.Names = NO

# The guides for contributors: plain language, and no RFC 2119 key words.
[{CONTRIBUTING.md,SUPPORT.md,docs/README.md,docs/development.md,docs/testing-on-real-vms.md,docs/releasing.md,docs/writing-guide.md}]
Project.Keywords = YES
Project.Avoid = YES
Project.SentenceLength = YES

# The guides for operators: also no identifiers of the design documents.
[{README.md,docs/user/**/*.md,deploy/**/README.md,images/README.md}]
Project.Keywords = YES
Project.DesignIDs = YES
Project.Avoid = YES
Project.SentenceLength = YES
