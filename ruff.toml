# ruff checks the Python scripts (mise run lint-scripts). The rules live here, so that a developer
# and CI apply the same set.

# mise pins Python 3.13, and every task and workflow runs the scripts with it.
target-version = "py313"
line-length = 100

[lint]
# pycodestyle, Pyflakes, bugbear, pyupgrade, simplify, and the import order. These find defects
# and old syntax, and they agree with the code as it is written.
select = ["E", "F", "W", "B", "UP", "SIM", "I"]

[lint.per-file-ignores]
# Each of these files has one line longer than 100 characters. The script-correctness pull request
# shortens the lines and removes these entries.
"scripts/check-commits.py" = ["E501"]
"scripts/check-deps.py" = ["E501"]
"scripts/check-docs.py" = ["E501"]
"scripts/check-upstream.py" = ["E501"]
"scripts/test_check_docs.py" = ["E501"]

[format]
# No script has the format of ruff yet. The script-correctness pull request formats each file in
# a commit of its own and removes it from this list, and ruff format --check then covers it.
exclude = [
  "scripts/check-commits.py",
  "scripts/check-deps.py",
  "scripts/check-docs.py",
  "scripts/check-upstream.py",
  "scripts/test_check_commits.py",
  "scripts/test_check_deps.py",
  "scripts/test_check_docs.py",
  "scripts/test_check_upstream.py",
  "scripts/test_release_finish.py",
]
