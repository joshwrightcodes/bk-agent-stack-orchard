# ruff checks the Python scripts (mise run lint-scripts). The rules live here, so that a developer
# and CI apply the same set.

# mise pins Python 3.13, and every task and workflow runs the scripts with it.
target-version = "py313"
line-length = 100

[lint]
# pycodestyle, Pyflakes, bugbear, pyupgrade, simplify, and the import order. These find defects
# and old syntax, and they agree with the code as it is written.
select = ["E", "F", "W", "B", "UP", "SIM", "I"]

