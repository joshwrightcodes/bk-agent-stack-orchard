# Tool versions and tasks for bk-agent-stack-orchard.
#
# One file gives a developer and CI the same versions (target design, section 15).

# mise.lock records, for each tool and platform, the download URL and the checksum of the file
# that the version resolved to on the day of the lock. Without it, mise resolves each install again
# and trusts whatever the release or the registry publishes at that time. For each PyPI tool, the
# lock points to a uv.lock in .mise/locks that holds the hash of every wheel in its environment.
# lockfile = true keeps the lock current when a person changes a version here and runs mise
# install. The platforms are the Linux runners of CI (linux-x64), a Linux container or VM on an
# Apple silicon Mac (linux-arm64), and an Apple silicon Mac or macOS runner (macos-arm64). mise lock
# also adds the platform that it runs on. mise run check-lock fails when the lock is behind this
# file.
[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64"]

[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
goreleaser = "2.18.2"
# govulncheck reports a known vulnerability that the code can reach. The go backend installs the
# module at this version, which the checksum database of Go confirms.
"go:golang.org/x/vuln/cmd/govulncheck" = { version = "1.9.0", depends = ["go"] }
# go-licenses saves the licence texts of the modules that the binary links (task licenses).
"go:github.com/google/go-licenses/v2" = { version = "2.0.1", depends = ["go"] }
# The release signs with cosign and makes the SBOMs with syft (ADR-0013).
cosign = "3.1.4"
syft = "1.55.0"
# The quick start reads the JSON log of the controller with jq (scripts/quickstart.sh).
jq = "1.8.2"
# Vale checks the language rules of the writing guide (.vale.ini, mise run check-docs).
vale = "3.26.0"
# The manifests of deploy are checked with these. The aqua backend of mise checks the checksum
# that each release publishes.
helm = "4.3.0"
kubeconform = "0.8.0"
kustomize = "5.8.1"
# The smoke deployment on kind builds the images with ko and loads them into the cluster.
kind = "0.33.0"
ko = "0.19.1"
kubectl = "1.37.1"
# The Mac hosts are set up with Ansible (deploy/hosts). The pypi backend installs each one in its
# own environment with uv, and ansible-lint gets the same ansible-core. ansible-core 2.21 needs
# Python 3.12 or later on this side, and 3.9 or later on a host. mise locks the whole dependency
# tree of each tool (a uv.lock in .mise/locks, with the hash of each wheel) and installs it with uv
# sync --frozen, so a cache miss gets the same packages as a cache hit. A locked environment uses
# the Python of mise, not one that uv downloads, so a CI cache restores the environment with its
# interpreter. Renovate moves both ansible-core pins below in one pull request.
python = "3.13.15"
uv = "0.12.19"
"pypi:ansible-core" = "2.21.4"
"pypi:ansible-lint" = { version = "26.9.0", with = ["ansible-core==2.21.4"] }

# Orchard runs the skeleton journey in synthetic mode, with no Mac and no Tart. The version MUST be
# the minimum Orchard version of the target design, which scripts/check-deps.py confirms. Each
# platform names its archive and the SHA-256 that the release publishes, so a tag that moves cannot
# change the binary without a failed install.
[tools."github:openai/orchard"]
version = "0.58.0"
# The macOS release binary fails its own signature check: its designated requirement looks for the
# Developer ID marker on the root certificate, not the intermediate (openai/orchard#456, still so in
# 0.58.0), and macOS 26 kills it at launch. The signature is otherwise intact, so this keeps the
# release binary as orchard.release, verifies it against a correct Developer ID requirement for the
# team of the release, and fails the install if that check fails. Only then does it make orchard,
# an ad hoc signed copy of the verified file. It never signs a file that it has not verified, and
# it runs on each install, so a restored cache is checked again. It changes nothing on Linux.
postinstall = { when = "always", run = """
set -eu
[ "$(uname -s)" = Darwin ] || exit 0
dir="$MISE_TOOL_INSTALL_PATH"
[ -f "$dir/orchard.release" ] || mv "$dir/orchard" "$dir/orchard.release"
chmod a-x "$dir/orchard.release"
codesign --verify --strict -R='anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] exists and certificate leaf[field.1.2.840.113635.100.6.1.13] exists and certificate leaf[subject.OU] = "9M2P8L4D89"' "$dir/orchard.release"
cp "$dir/orchard.release" "$dir/orchard.tmp"
chmod a+x "$dir/orchard.tmp"
codesign --force --sign - "$dir/orchard.tmp"
mv -f "$dir/orchard.tmp" "$dir/orchard"
""" }

[tools."github:openai/orchard".platforms]
linux-x64 = { asset_pattern = "orchard-linux-amd64.tar.gz", checksum = "sha256:55370716a7e5ad86643a9829afbdf99b57e0cc957bb7dcef2a8a2acd44b97051" }
linux-arm64 = { asset_pattern = "orchard-linux-arm64.tar.gz", checksum = "sha256:00bb625c177049cb052d68ebb1992da89e1b09da2f8b516fc0b6009e45d5fddf" }
macos-x64 = { asset_pattern = "orchard-darwin-amd64.tar.gz", checksum = "sha256:c25a3303b6f19646fb5f5108d30050a50450b1030d2f126ffba3778c3e4c834a" }
macos-arm64 = { asset_pattern = "orchard-darwin-arm64.tar.gz", checksum = "sha256:aa912db4d47d93413dabfd34c856c6ebb124e09d13fba70b5a62467276a1a71d" }

[tasks.check-docs]
description = "Check that the document set stays whole, and the language rules of the writing guide (Vale)"
run = ["python3 scripts/check-docs.py", "vale --glob='!{build,dist}/**' ."]

[tasks.check-commits]
description = "Check the commit messages of this branch"
run = "python3 scripts/check-commits.py"

# jdx/mise-action runs mise install --locked when the repository has a mise.lock, so a CI install
# takes each URL and checksum from the lock, and fails on a tool that the lock does not cover. This
# task catches the other failure: a version in mise.toml that the lock does not follow. mise lock
# rewrites the lock from mise.toml and keeps every entry that is still current, so any change that
# it makes, a new sidecar in .mise/locks included, means that the committed lock was behind.
# It reads the GitHub API, so set GITHUB_TOKEN to avoid its rate limit.
[tasks.check-lock]
description = "Fail when mise.lock or a PyPI lock in .mise/locks is behind mise.toml"
run = '''
set -eu
mise lock
if [ -n "$(git status --porcelain -- mise.lock .mise/locks)" ]; then
  echo "check-lock: mise.lock is behind mise.toml. Run mise lock and commit the result." >&2
  git status --short -- mise.lock .mise/locks >&2
  git --no-pager diff -- mise.lock >&2
  exit 1
fi
echo "check-lock: mise.lock is current"
'''

[tasks.test-scripts]
description = "Test the check scripts"
run = "python3 -m unittest discover -s scripts -p 'test_*.py'"

[tasks.check-c4]
description = "Validate the C4 workspace and the generated views"
run = "./scripts/check-c4.sh"

[tasks.generate]
description = "Write the generated files, including the Orchard wire types"
run = "go generate ./..."

[tasks.docs-reference]
description = "Write docs/user/configuration.md from the comments of the configuration types"
run = "go test ./internal/config -run '^TestTheConfigurationReferenceIsCurrent$' -update"

[tasks.check-generate]
description = "Fail when a generated file is behind the version that the documents pin"
# git add -N first: a generated file that nobody added is invisible to git diff, so a new one
# would pass this check without it. The intent to add covers only the generated files, which
# are the paths that the diff then reads. It does not stage anything else of the tree.
run = [
  "go generate ./...",
  "git add -N -- ':(glob)**/*_gen.go'",
  "git diff --exit-code -- ':(glob)**/*_gen.go'",
]

[tasks.check-deps]
description = "Check the dependency and licence rules of go.mod"
run = "python3 scripts/check-deps.py"

[tasks.lint]
description = "Run the golangci-lint analysis over the Go code"
run = "golangci-lint run"

[tasks.lint-format]
description = "Check the formatting that golangci-lint owns"
run = "golangci-lint fmt --diff"

[tasks.lint-config]
description = "Check that .golangci.yaml is valid"
run = "golangci-lint config verify"

[tasks.test]
description = "Run the Go tests with the race detector"
run = "go test -race ./..."

[tasks.vuln]
description = "Report known vulnerabilities that the code can reach (govulncheck)"
run = "govulncheck ./..."

# go test runs the seed inputs of each fuzz test with the other tests. This task fuzzes each target
# in turn, for FUZZTIME each. go test can fuzz one target of one package at a time.
[tasks.fuzz]
description = "Fuzz each fuzz test of the module, for FUZZTIME each (default 1m)"
run = '''
set -eu
for package in $(go list ./...); do
  for target in $(go test -list '^Fuzz' "$package" | grep '^Fuzz' || true); do
    go test "$package" -run '^$' -fuzz "^${target}\$" -fuzztime "${FUZZTIME:-1m}"
  done
done
'''

[tasks.integration]
description = "Run the integration tests against orchard dev in synthetic mode"
run = "go test -tags integration -count=1 ./test/integration/..."

[tasks.test-startup-script]
description = "Run the tests of the VM startup script under the sh and zsh of this computer"
run = "go test -count=1 -run '^TestTheScript' ./internal/vmspec/"

[tasks.check-deploy]
description = "Lint the Helm chart, and validate the chart and the Orchard manifests against the Kubernetes schemas"
run = [
  "helm lint deploy/helm/bk-agent-stack-orchard -f deploy/helm/bk-agent-stack-orchard/ci/values.yaml --strict",
  "helm lint deploy/helm/bk-agent-stack-orchard -f test/smoke/values.yaml --strict",
  """
  set -eu
  chart=deploy/helm/bk-agent-stack-orchard
  for good in "$chart"/ci/good/*.yaml; do
    helm lint "$chart" -f "$chart/ci/values.yaml" -f "$good" --strict
  done
  # Each bad file MUST fail the schema. A lint that passes, or that fails for another reason,
  # means that the schema lost a rule.
  for bad in "$chart"/ci/bad/*.yaml; do
    if out=$(helm lint "$chart" -f "$chart/ci/values.yaml" -f "$bad" --strict 2>&1); then
      echo "check-deploy: $bad lints clean, so the schema lost a rule" >&2
      exit 1
    fi
    case "$out" in
      *"values don't meet the specifications of the schema"*) echo "refused as expected: $bad" ;;
      *) printf '%s\n' "$out" >&2; echo "check-deploy: $bad failed, but not on the schema" >&2; exit 1 ;;
    esac
  done
  """,
  "rm -rf build/chart-check && helm package deploy/helm/bk-agent-stack-orchard --destination build/chart-check >/dev/null && ! tar -tzf build/chart-check/*.tgz | grep -q '/ci/'",
  "helm template bkaso deploy/helm/bk-agent-stack-orchard -f deploy/helm/bk-agent-stack-orchard/ci/values.yaml | kubeconform -strict -summary -kubernetes-version 1.37.0 -",
  "kustomize build deploy/orchard | kubeconform -strict -summary -kubernetes-version 1.37.0 -",
  "kustomize build deploy/orchard-overlays/internal-lb | kubeconform -strict -summary -kubernetes-version 1.37.0 -",
  "kustomize build test/smoke/orchard | kubeconform -strict -summary -kubernetes-version 1.37.0 -",
]

[tasks.smoke]
description = "Deploy the chart and the Orchard base on kind, and wait for readiness and telemetry"
run = "./scripts/smoke.sh"

[tasks.check-hook]
description = "Check the environment hook of the agent image, as buildkite-agent runs it"
run = "./scripts/check-hook.sh"

[tasks.agent-image]
description = "Build the agent image (no Xcode) into a local Tart VM on an Apple silicon Mac (optional ARTIFACT_DESTINATION names an owner storage)"
run = "./images/build.sh agent"

[tasks.pilot-image]
description = "Build the pilot image (Xcode 27) into a local Tart VM, from the Xcode archive in ~/XcodesCache (optional ARTIFACT_DESTINATION, XCODE_ARCHIVE, XCODE_URL, IMAGE_REGISTRY)"
run = "./images/build.sh pilot"

[tasks.check-hosts]
description = "Lint the playbook of the Mac hosts, and check the images that each host pulls"
dir = "deploy/hosts"
run = ["ansible-lint", "ansible-playbook -i localhost, test/select.yml"]

[tasks.hosts-test]
description = "Run the playbook of the Mac hosts against a Tart VM, with an Orchard controller on this Mac"
run = "./deploy/hosts/test/vm.sh"

[tasks.tart-test]
description = "Run one job on a real Tart machine of this Mac through the guest agent (BKASO_TART_IMAGE names the agent image)"
run = "go test -tags integration,tart -count=1 -timeout 30m -run TestARealMachineRunsTheStartupScript -v ./test/integration/"

[tasks.softnet-test]
description = "Probe the network of a real Tart machine of this Mac: the Internet, the host, the LAN, and another machine (BKASO_TART_IMAGE names the agent image)"
run = "go test -tags integration,tart -count=1 -timeout 30m -run TestSoftnetKeepsABuildAwayFromTheHostAndThePrivateNetwork -v ./test/integration/"

[tasks.failures-test]
description = "Run jobs whose machine or agent cannot start on real Tart machines of this Mac, and check what each job page says (BKASO_TART_IMAGE names the agent image)"
run = "go test -tags integration,tart -count=1 -timeout 45m -run 'TestAnImageThatDoesNotExist|TestAnAgentThat' -v ./test/integration/"

[tasks.restart-test]
description = "Crash the controller while the agent of a job runs in a real Tart machine of this Mac, and check that the next process takes the machine over (BKASO_TART_IMAGE names the agent image)"
run = "go test -tags integration,tart -count=1 -timeout 30m -run TestAControllerCrashKeepsTheRealMachineOfARunningJob -v ./test/integration/"

[tasks.load]
description = "Run the load test at the target scale, about 25 minutes"
run = "go test -tags integration,load -count=1 -timeout 45m -run TestTheControllerCarriesTheTargetScale -v ./test/integration/"

[tasks.orchard-image]
description = "Build the image of the Orchard controller from its release (deploy/orchard/image)"
run = "docker buildx build --load -t orchard:0.58.0 deploy/orchard/image"


[tasks.quickstart]
description = "See one real job in a Tart VM on this Mac: a local Orchard, the controller, and your Buildkite queue (BUILDKITE_AGENT_TOKEN, then -- --queue NAME)"
run = "scripts/quickstart.sh"

[tasks.build]
# go build of several packages compiles them and keeps no binary, so the controller gets its own
# command, which writes ./bk-agent-stack-orchard. .gitignore excludes that file.
description = "Compile every package, and build the controller binary"
run = ["go build ./...", "go build -trimpath -o . ./cmd/bk-agent-stack-orchard"]

[tasks.snapshot]
description = "Build the release artifacts and the image, without publishing"
# A snapshot has no OIDC token to sign with, so it skips the signatures and builds the rest,
# the SBOMs included.
run = [
  "goreleaser check",
  "goreleaser release --snapshot --clean --skip=sign",
  "./scripts/check-image.sh",
]

[tasks.licenses]
description = "Write the licence texts of the modules that the controller binary links into build/licenses"
run = "./scripts/licenses.sh"

[tasks.check]
description = "Run every gate that this repository has"
depends = ["check-docs", "check-commits", "check-c4", "check-deps", "check-deploy", "lint",
           "lint-format", "lint-config", "test", "lint-scripts"]

# ci differs from check. check is the gate before a pull request: it holds the checks of the
# repository, and it needs Docker for check-c4. ci runs what the required jobs of CI run, so a
# green ci predicts a green pull request. It adds vuln, check-hook, check-hosts, check-generate,
# integration, test-startup-script, and test-scripts, which check does not run. It leaves out the
# title gate, which needs the title of a pull request. check-commits reads the commits since
# origin/main.
# check-generate rewrites the generated files, and the other checks compile them, so ci runs
# check-generate alone and first, and then runs the other checks in parallel (ci-checks).
# The jobs that need Docker (check-c4, orchard-image, smoke, snapshot) run in ci-docker, which
# skips them with a message when Docker is absent.
[tasks.ci]
description = "Run the checks that the required CI jobs run; Docker jobs skip without Docker"
run = [{ task = "check-generate" }, { task = "ci-checks" }]

[tasks.ci-checks]
description = "Run the checks of ci in parallel, after check-generate (use mise run ci)"
depends = ["check-docs", "check-commits", "test-scripts", "check-deps", "lint", "lint-format",
           "lint-config", "test", "vuln", "check-deploy", "check-hook", "check-hosts",
           "integration", "test-startup-script", "ci-docker", "lint-scripts"]

[tasks.ci-docker]
description = "Run the CI jobs that need Docker: c4 model, Orchard image, smoke deployment, snapshot"
run = '''
set -eu
if ! docker info >/dev/null 2>&1; then
  echo "ci-docker: Docker is not available, so c4 model, orchard-image, smoke, and snapshot are skipped. CI runs them."
  exit 0
fi
mise run check-c4
mise run orchard-image
mise run smoke
mise run snapshot
'''

# The linters of the shell and Python scripts and of the workflows, and their tasks. They are in
# tables of their own, so that they stay together in one block. The aqua backend of mise checks
# the checksum or the build attestation that each release publishes. ShellCheck publishes neither,
# so only its version pins it.
[tools.shellcheck]
version = "0.11.0"

[tools.shfmt]
version = "3.14.1"

[tools.ruff]
version = "0.17.3"

[tools.actionlint]
version = "1.7.12"

[tools.zizmor]
version = "1.31.1"

[tasks.lint-scripts]
description = "Lint the shell and Python scripts and the workflows (shellcheck, shfmt, ruff, actionlint, zizmor)"
run = '''
set -euf
# Only the files that git tracks, so that build output and caches stay out. shfmt -f keeps the
# shell scripts, by extension or by shebang (images/files/environment has no extension). set -f
# turns off globbing, so the unquoted lists below split only on white space.
shell="$(git ls-files -z | xargs -0 shfmt -f)"
python="$(git ls-files '*.py')"

shellcheck $shell

# These scripts do not have the style of shfmt yet. The script-correctness pull request formats
# each one in a commit of its own and removes it from this list.
unformatted='scripts/check-c4.sh
scripts/check-image.sh
scripts/licenses.sh
scripts/quickstart.sh
scripts/release-finish.sh
scripts/release-publish.sh
scripts/verify-release.sh
images/build.sh
deploy/hosts/test/pf.sh
deploy/hosts/test/vm.sh
docs/architecture/render-c4-md.sh'
formatted="$(printf '%s\n' $shell | grep -vxF "$unformatted" || true)"
# -i 0 is the default style of shfmt (tabs). With a style flag, shfmt reads no .editorconfig, so
# the result is the same on each computer.
if [ -n "$formatted" ]; then
  shfmt -i 0 -d $formatted
fi

# ruff.toml holds the rules, and the files that ruff format does not check yet.
ruff check --no-cache $python
ruff format --check --no-cache --force-exclude $python

# actionlint also runs shellcheck over the run: blocks of the workflows.
actionlint
# --offline runs the audits that work without the GitHub API.
zizmor --offline .github/workflows
'''
