# Tool versions and tasks for bk-agent-stack-orchard.
#
# One file gives a developer and CI the same versions (target design, section 15). W-01 adds Go,
# golangci-lint, and GoReleaser here. The checks of W-26 need only Python and Docker, which the
# development machine and the CI runner already have.

[tools]

[tasks.check-docs]
description = "Check that the document set stays whole (T-124)"
run = "python3 scripts/check-docs.py"

[tasks.check-commits]
description = "Check the commit messages of this branch (T-123)"
run = "python3 scripts/check-commits.py"

[tasks.check-c4]
description = "Validate the C4 workspace and the generated views (T-121)"
run = "./scripts/check-c4.sh"

[tasks.check]
description = "Run every gate that this repository has"
depends = ["check-docs", "check-commits", "check-c4"]
