# Tool versions and tasks for bk-agent-stack-orchard.
#
# One file gives a developer and CI the same versions (target design, section 15).

[tools]
go = "1.27.1"
golangci-lint = "2.13.2"
goreleaser = "2.18.2"
# The chart of deploy/helm is checked with these. The aqua backend of mise checks the checksum
# that each release publishes.
helm = "4.3.0"
kubeconform = "0.8.0"

# Orchard runs the skeleton journey in synthetic mode, with no Mac and no Tart. The version MUST be
# the minimum Orchard version of the target design, which scripts/check-deps.py confirms. Each
# platform names its archive and the SHA-256 that the release publishes, so a tag that moves cannot
# change the binary without a failed install.
[tools."github:openai/orchard"]
version = "0.57.0"

[tools."github:openai/orchard".platforms]
linux-x64 = { asset_pattern = "orchard-linux-amd64.tar.gz", checksum = "sha256:8e54692d5d38eac228b63fc16f0e801c4d7335287b9f1922743e0ac6e4c382d5" }
linux-arm64 = { asset_pattern = "orchard-linux-arm64.tar.gz", checksum = "sha256:5c744e2883ff02b3e3e42b9ecaa42922411843653ea708eb7e37ee393c945d1f" }
macos-x64 = { asset_pattern = "orchard-darwin-amd64.tar.gz", checksum = "sha256:b93202610373e1e0f4342ad7e03820e5d74a7891e92cf7532effce2a16b4d256" }
macos-arm64 = { asset_pattern = "orchard-darwin-arm64.tar.gz", checksum = "sha256:63b511cb9ba4ecadda947d70763b4a226f9f0d56422e147cbf2a2b9b2eeabd26" }

[tasks.check-docs]
description = "Check that the document set stays whole"
run = "python3 scripts/check-docs.py"

[tasks.check-commits]
description = "Check the commit messages of this branch"
run = "python3 scripts/check-commits.py"

[tasks.check-c4]
description = "Validate the C4 workspace and the generated views"
run = "./scripts/check-c4.sh"

[tasks.generate]
description = "Write the generated files, including the Orchard wire types"
run = "go generate ./..."

[tasks.check-generate]
description = "Fail when a generated file is behind the version that the documents pin"
# git add -N first: a generated file that nobody added is invisible to git diff, so a new one
# would pass this check without it.
run = ["go generate ./...", "git add -N .", "git diff --exit-code -- ':(glob)**/*_gen.go'"]

[tasks.check-deps]
description = "Check the dependency and licence rules of go.mod"
run = "python3 scripts/check-deps.py"

[tasks.lint]
description = "Run the golangci-lint analysis over the Go code"
run = "golangci-lint run"

[tasks.lint-format]
description = "Check the formatting that golangci-lint owns"
run = "golangci-lint fmt --diff"

[tasks.lint-config]
description = "Check that .golangci.yaml is valid"
run = "golangci-lint config verify"

[tasks.test]
description = "Run the Go tests"
run = "go test ./..."

[tasks.integration]
description = "Run the integration tests against orchard dev in synthetic mode"
run = "go test -tags integration -count=1 ./test/integration/..."

[tasks.check-chart]
description = "Lint the Helm chart, and validate what it renders against the Kubernetes schemas"
run = [
  "helm lint deploy/helm/bk-agent-stack-orchard -f deploy/helm/bk-agent-stack-orchard/ci/values.yaml --strict",
  "helm template bkaso deploy/helm/bk-agent-stack-orchard -f deploy/helm/bk-agent-stack-orchard/ci/values.yaml | kubeconform -strict -summary -kubernetes-version 1.34.0 -",
]

[tasks.build]
description = "Build the binary"
run = "go build ./..."

[tasks.snapshot]
description = "Build the release artifacts and the image, without publishing"
run = ["goreleaser check", "goreleaser release --snapshot --clean", "./scripts/check-image.sh"]

[tasks.check]
description = "Run every gate that this repository has"
depends = ["check-docs", "check-commits", "check-c4", "check-deps", "check-chart", "lint",
           "lint-format", "lint-config", "test"]
