# The Orchard base of deploy/orchard, as an operator deploys it for the first start, with the image
# that the smoke test builds and loads into kind, the collector of the smoke namespace, and the
# namespace of the controller in the NetworkPolicy. Each smoke run is a first start, so it has the
# component first-start, which gives Orchard the token of the bootstrap admin. kind uses kindnet, which enforces a NetworkPolicy, so this
# test proves that the controller and the Job reach Orchard, and not that others are refused.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: orchard
resources:
  - ../../../deploy/orchard
components:
  - ../../../deploy/orchard-overlays/first-start
images:
  - name: orchard
    newName: orchard
    newTag: smoke
patches:
  - target: {kind: NetworkPolicy, name: orchard}
    patch: |
      - op: replace
        path: /spec/ingress/0/from/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: smoke
configMapGenerator:
  - name: orchard-telemetry
    behavior: replace
    literals:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://collector.smoke:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_SERVICE_NAME=orchard
