# The fake Stacks API of this project, as the Buildkite of the smoke deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fakestacks
  namespace: smoke
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fakestacks
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fakestacks
    spec:
      containers:
        - name: fakestacks
          image: ko.local/fakestacks:smoke
          imagePullPolicy: Never
          env:
            - name: STACK_KEY
              value: smoke
          ports:
            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: fakestacks
  namespace: smoke
spec:
  selector:
    app.kubernetes.io/name: fakestacks
  ports:
    - name: http
      port: 8080
      targetPort: http
