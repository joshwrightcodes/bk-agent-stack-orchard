version: "2"

run:
  go: "1.27"
  # The integration tests and the load test sit behind build tags, and the analysis covers all Go
  # code.
  build-tags:
    - integration
    - load

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - forbidigo
    - gocritic
    - gosec
    - misspell
    - noctx
    - revive
    - sloglint
    - unconvert
    - usestdlibvars
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        # Every part reads the one clock that internal/app gives it, so that the component suite
        # can run the controller in its own time. A part that reads the clock of the machine
        # decides by a time that the suite does not control, and a test of it passes only at
        # some moments. A constructor may default a nil clock to time.Now, with a nolint comment.
        - pattern: ^time\.(Now|Since|Until)$
          msg: read the clock that the part was given, not the clock of the machine
  exclusions:
    rules:
      # A test fixes its own times, and some measure the real time that a step takes. The fakes
      # and the journeys under test/ run beside a real process, in real time.
      - path: _test\.go
        linters:
          - forbidigo
      - path: ^test/
        linters:
          - forbidigo

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/joshwrightcodes/bk-agent-stack-orchard
